<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Resumo da análise do estoque de veículos</title>
  <desc id="desc">Valor anunciado por faixa de dias em estoque e permanência média por categoria de origem.</desc>
  <rect width="1200" height="690" rx="24" fill="#f4f7fb"/>
  <text x="54" y="58" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#183451">Estoque anunciado: onde está a concentração?</text>
  <text x="55" y="90" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#516579">Relatório de 03/08/2026 · 184 registros · 123 veículos com preço anunciado</text>

  <rect x="50" y="122" width="705" height="510" rx="18" fill="#ffffff" stroke="#dbe4ee"/>
  <text x="78" y="164" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#183451">Valor anunciado por tempo em estoque</text>
  <text x="78" y="190" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#64778a">Escala proporcional · total considerado: R$ 8.266.200</text>

  <text x="78" y="244" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#30465c">0–30 dias · 3 veículos</text>
  <rect x="78" y="255" width="17" height="19" rx="4" fill="#8ab9d8"/>
  <text x="122" y="270" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#30465c">R$ 179.770 · 2,2%</text>

  <text x="78" y="326" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#30465c">31–90 dias · 55 veículos</text>
  <rect x="78" y="337" width="197" height="19" rx="4" fill="#5a9bc8"/>
  <text x="289" y="352" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#30465c">R$ 2.091.250 · 25,3%</text>

  <text x="78" y="408" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#30465c">91–180 dias · 31 veículos</text>
  <rect x="78" y="419" width="266" height="19" rx="4" fill="#2c7fb8"/>
  <text x="358" y="434" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#30465c">R$ 2.818.600 · 34,1%</text>

  <text x="78" y="490" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#a94d21">Mais de 180 dias · 34 veículos</text>
  <rect x="78" y="501" width="300" height="23" rx="4" fill="#e87940"/>
  <text x="392" y="518" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#a94d21">R$ 3.176.580 · 38,4%</text>

  <rect x="78" y="554" width="645" height="52" rx="10" fill="#fff3eb"/>
  <text x="96" y="577" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#7d3a18">O valor é calculado com base nos preços anunciados,</text>
  <text x="96" y="596" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#7d3a18">não no custo de aquisição nem na margem de lucro.</text>

  <rect x="775" y="122" width="375" height="510" rx="18" fill="#ffffff" stroke="#dbe4ee"/>
  <text x="802" y="164" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#183451">Dias médios em estoque</text>
  <text x="802" y="190" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#64778a">Por categoria · apenas itens com preço</text>

  <text x="802" y="244" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#30465c">Normal · n=82</text>
  <rect x="802" y="256" width="125" height="25" rx="5" fill="#2c7fb8"/>
  <text x="938" y="274" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#30465c">148 dias</text>

  <text x="802" y="334" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#30465c">Repasse · n=26</text>
  <rect x="802" y="346" width="129" height="25" rx="5" fill="#8a9299"/>
  <text x="942" y="364" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#30465c">153 dias</text>

  <text x="802" y="424" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#a94d21">Ex-locado · n=15</text>
  <rect x="802" y="436" width="278" height="29" rx="5" fill="#e87940"/>
  <text x="802" y="491" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#a94d21">329 dias</text>
  <text x="802" y="517" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#64778a">Maior média observada no recorte.</text>

  <rect x="802" y="554" width="322" height="52" rx="10" fill="#eef4f8"/>
  <text x="818" y="577" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#3b536a">Médias de idade dos itens ainda em estoque;</text>
  <text x="818" y="596" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#3b536a">não são taxas de giro nem prova de causalidade.</text>
</svg>